# ==============================================================================
# 1. GHOSTTY TERMINAL CAPABILITIES & CORE OVERRIDES
# ==============================================================================
unbind C-b
unbind C-a
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-overrides ',xterm-ghostty:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',xterm-ghostty:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%&%d::%p1%{255}%&%d%;m'

set -g mouse on
set -g focus-events on
set -s escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind f resize-pane -Z
setw -g mode-keys vi

# ==============================================================================
# 2. STRUCTURAL ISOLATION BUFFER  (blank row = format[0], under panes)
#    windows CENTERED, session left, clock right
# ==============================================================================
set -g status 2
set -g status-justify centre
set -g status-format[0] ""
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# ==============================================================================
# 3. SOLARIZED DARK ROUNDED CAPSULE THEME
#    caps: U+E0B6 (left)  U+E0B4 (right)  -- needs a Nerd Font in Ghostty
#    base03 #002b36  base02 #073642  base00 #657b83  base1 #93a1a1
#    blue #268bd2  cyan #2aa198  magenta #d33682
# ==============================================================================
set -g status-style "bg=default,fg=#657b83"

# Session capsule (LEFT): rounded blue pill
set -g status-left-length 40
set -g status-left "#[fg=#268bd2,bg=default]#[fg=#002b36,bg=#268bd2,bold] #S #[fg=#268bd2,bg=default]"

# Clock capsule (RIGHT): rounded magenta pill
set -g status-right-length 150
set -g status-right "#[fg=#d33682,bg=default]#[fg=#002b36,bg=#d33682,bold] %Y-%m-%d │ %H:%M #[fg=#d33682,bg=default]"

# Inactive windows (CENTER): rounded base02 pill
setw -g window-status-format "#[fg=#073642,bg=default]#[fg=#93a1a1,bg=#073642] #I:#W #[fg=#073642,bg=default]"
# Active window (CENTER): rounded cyan pill
setw -g window-status-current-format "#[fg=#2aa198,bg=default]#[fg=#002b36,bg=#2aa198,bold] #I:#W #[fg=#2aa198,bg=default]"
setw -g window-status-separator " "
# tmux 3.8 defaults this to "underscore", which underlines the active pill
setw -g window-status-current-style default

set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#2aa198"
# Session/window chooser preview: thin line instead of 3.8's solid grey band
setw -g tree-mode-border-style "fg=#073642,bg=default"

# ==============================================================================
# 4. RELOAD UTILITY
# ==============================================================================
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Ghostty Tmux Configuration Reloaded!"
